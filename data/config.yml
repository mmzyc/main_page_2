title: 木锦棉棉の工具页
lang: zh
theme: system
services:
  自己的工具:
    - title: 短链接
      description: 生成短链接（虽然本来这个地址就挺长的）
      link: 'https://dl.mjmm.dpdns.org/'
      icon:
        url: https://blog.mjmm.top/upload/favicon.png
        wrap: false
        color: '#3dbcf3'
      status:
        enabled: true
        interval: 3600
    - title: 照妖镜
      description: 顾名思义
      link: 'https://zyj.mjmm.dpdns.org/sc.php'
      icon:
        url: https://blog.mjmm.top/upload/favicon.png
        wrap: false
        color: '#68bc71'
      status:
        enabled: true
        interval: 3600
    - title: yaml生成工具
      description: 可以生成yaml配置
      link: 'https://tool.mjmm.dpdns.org/yaml_tool/'
      icon:
        url: https://blog.mjmm.top/upload/favicon.png
      status:
        enabled: true
        interval: 3600
    - title: 棉の备用vpn
      description: 棉の备用vpn，用以防止主用出问题
      link: https://cfvpn.mjmm.top/admin
      icon:
        url: https://blog.mjmm.top/upload/favicon.png
      status:
        enabled: true
        interval: 3600
        
    - title: 棉の备用vpn2
      description: 使用BPB Panel项目搭建
      link: https://bpb.mjmm.top/panel
      icon:
        url: https://bpb.mjmm.top/favicon.ico
      status:
        enabled: true
        interval: 3600



  实用工具:
    - title: 命令生成器
      description: 用于生成Minecraft命令
      link: https://mcstacker.net/1.20.php
      icon:
        url: https://mcstacker.net/MCStacker_Favicon.png
        wrap: true
      status:
        enabled: true
        interval: 3600

    - title: 数据包生成器
      description: 用以辅助制作minecraft数据包
      link: https://misode.github.io/
      icon:
        url: https://misode.github.io/assets/favicon-32-AFHRIzOg.png
      status:
        enabled: true
        interval: 3600


  有趣的网站:
    - title: 网络天才 Akinator
      description: 通过询问问题猜出你所想
      link: https://cn.akinator.com/
      icon:
        url: https://cn.akinator.com/favicon.ico
        wrap: true
      status:
        enabled: true
        interval: 3600
  
  其它网站:
    - title: Mafl
      description: 这个页面使用的主题
      link: https://mafl.hywax.space/
      icon:
        url: https://mafl.hywax.space/favicon.ico
        wrap: true
      status:
        enabled: true
        interval: 3600

    - 测试:
      - title: Mafl
        description: 这个页面使用的主题
        link: https://mafl.hywax.space/
        icon:
          url: https://mafl.hywax.space/favicon.ico
          wrap: true
        status:
          enabled: true
          interval: 3600

